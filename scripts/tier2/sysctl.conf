# goim Tier 2 load tests (choice #68). host-setup.sh installs this file as
# /etc/sysctl.d/90-goim-tier2.conf; lib.sh's t2_require_host_setup checks
# that each running value is at least the one here.
# Conntrack: 600k connections on loopback are 600k entries, and a storm
# adds as many again in TIME_WAIT (120s); the gateway's self-check wants
# 2 x its cap (R5S-O7).
net.netfilter.nf_conntrack_max = 4194304
net.netfilter.nf_conntrack_buckets = 1048576
# Accept queues for 20k handshakes/s storms.
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
# Loopback input queue per CPU: every loopback packet is queued on the
# sending CPU's backlog, and the default 1000 dropped 35% of packets in run 14
# (SYNs resent 1s/3s/7s later: dial timeouts, 5s handshake timeouts, lost
# connections at 600k). capacity.sh checks that a phase sees no drop.
net.core.netdev_max_backlog = 65536
# TCP buffer memory in pages (4, 6, 8 GB): both ends of 600k sockets live on this host.
net.ipv4.tcp_mem = 1048576 1572864 2097152
# File handles per process: reconnect's ghost phase keeps every client's old
# socket beside its new one on loadgen, up to 1.2M fds (#136.5). nr_open caps
# the nofile hard limit, which host-setup.sh raises to 2,097,152. host-setup.sh
# leaves it out when the host's is higher (systemd raises it at boot).
fs.nr_open = 2097152
# kind (Tier 3 TARGET=local, choice #67).
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
