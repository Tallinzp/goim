# Tier 3 TARGET=local on scripts/tier3/kind.yaml (#150); the client
# NodePort's IPVS (least connections) stands in for the cloud LB (#67).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: im
resources:
  - ../../base
images:
  - name: goim
    newName: goim
    newTag: tier3
patches:
  - path: gateway.yaml
  - path: logic.yaml
