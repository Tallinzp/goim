# minReplicas covers the storm peak (R2-O7); the PDB keeps that many.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logic
  template:
    metadata:
      labels:
        app: logic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: logic
          image: goim
          command: ["/logic"]
          args: ["-redis=$(REDIS_ADDRS)", "-jwks-url=$(JWKS_URL)"]
          env:
            - name: REDIS_ADDRS
              valueFrom:
                configMapKeyRef:
                  name: goim-config
                  key: REDIS_ADDRS
            - name: JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: goim-config
                  key: JWKS_URL
          ports:
            - name: grpc
              containerPort: 9000
            - name: lease
              containerPort: 9001
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: jwks-fallback
              mountPath: /etc/goim/jwks-fallback
              readOnly: true
      volumes:
        - name: jwks-fallback
          configMap:
            name: jwks-fallback
---
apiVersion: v1
kind: Service
metadata:
  name: logic
spec:
  clusterIP: None
  selector:
    app: logic
  ports:
    - name: grpc
      port: 9000
    - name: lease
      port: 9001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logic
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: logic
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: logic
